[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mastipredict"
version = "0.1.0"
description = "AI-based software platform for early forecasting of bovine mastitis-related risk."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "MastiPredict Team"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
